<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Teló Final · Pantalla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&display=swap">
<link rel="stylesheet" href="css/estil.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { font-size: clamp(16px, 1.4vw, 26px); }
  .escena { height: 100vh; display: flex; flex-direction: column; }
  .franja { position: relative; height: 52vh; overflow: hidden; border-bottom: 4px solid var(--daurat); flex: none; }
  .franja img { width: 100%; height: 100%; object-fit: cover; }
  .franja .fase { position: absolute; left: 3vw; top: 3vh; font-size: 0.8em; padding: 0.5em 1em; background: var(--tinta); }
  .baix { flex: 1; display: flex; align-items: center; gap: 4vw; padding: 2vh 4vw; min-height: 0; }
  .baix .titol-joc { font-size: 4.6em; }
  .baix .text-fase { color: var(--fum); font-size: 1.1em; margin: 0.6em 0 0; max-width: 28em; }
  .comptadors { display: flex; gap: 1.5vw; margin-left: auto; }
  .comptador { background: var(--bordeus); border: 2px solid var(--daurat); border-radius: 14px; padding: 1em 1.4em; text-align: center; min-width: 7em; }
  .comptador b { display: block; font-family: var(--font-display); font-size: 2.6em; color: var(--daurat); line-height: 1; }
  .comptador span { font-size: 0.75em; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fum-calid); }
  .rumor-gran { position: absolute; left: 50%; bottom: 3vh; transform: translateX(-50%); width: min(80vw, 1100px); background: rgba(36,32,38,.92); border: 2px solid var(--corall); border-radius: 16px; padding: 1em 1.4em; }
  .rumor-gran .etiqueta { color: var(--corall); font-size: 0.7em; }
  .rumor-gran p { margin: 0.2em 0 0; font-size: 1.4em; font-style: italic; }
  /* Revelació */
  .revelacio { position: fixed; inset: 0; background: var(--bordeus); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4vh 5vw; text-align: center; cursor: pointer; }
  .revelacio h2 { font-family: var(--font-display); font-weight: 800; color: var(--daurat); font-size: 3.2em; margin: 0 0 0.3em; }
  .revelacio .gran-nom { font-family: var(--font-display); font-weight: 800; font-size: 4em; line-height: 1; }
  .revelacio .real { color: var(--fum-calid); font-size: 1.4em; margin-top: 0.3em; }
  .revelacio img.retrat { height: 50vh; aspect-ratio: 1/1; object-fit: contain; background: #EDE0C8; border-radius: 18px; border: 6px solid var(--daurat); margin-bottom: 3vh; animation: entra 0.8s ease both; }
  @keyframes entra { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
  .pista-pas { position: fixed; bottom: 2vh; right: 2vw; font-size: 0.7em; color: var(--fum-calid); }
  .barres { width: min(1100px, 90vw); text-align: left; }
  .barra { display: grid; grid-template-columns: 14em 1fr 3em; align-items: center; gap: 1em; margin: 0.5em 0; }
  .barra .b { height: 1.4em; background: var(--corall); border-radius: 6px; }
  .barra .n { font-family: var(--font-display); font-size: 1.4em; color: var(--daurat); }
  .duo { display: flex; gap: 5vw; justify-content: center; }
  .duo > div { background: var(--tinta); border: 3px solid var(--daurat); border-radius: 18px; padding: 1.4em 2.4em; min-width: 14em; }
  .duo .etiqueta { font-size: 0.8em; }
  .duo b { display: block; font-family: var(--font-display); font-size: 2.6em; color: var(--crema); margin-top: 0.2em; }
  .relat { font-size: 1.5em; max-width: 34em; line-height: 1.5; }
  .ranking { width: min(1000px, 90vw); text-align: left; }
  .ranking .fila-r { display: flex; justify-content: space-between; padding: 0.4em 0; border-bottom: 1px solid var(--linia); font-size: 1.3em; }
  .ranking .fila-r:first-child { color: var(--daurat); font-size: 1.7em; font-weight: 700; }
  .error-pantalla { padding: 10vh 5vw; }
</style>
</head>
<body>
<div class="escena" id="escena">
  <div class="franja">
    <img src="img/capcalera-pantalla.jpg" alt="Escenari amb el teló vermell, un focus i la silueta de guix d'un cos">
    <span class="fase" id="fase">…</span>
    <div class="rumor-gran" id="rumor" hidden><div class="etiqueta">Rumor anònim</div><p id="rumor-text"></p></div>
  </div>
  <div class="baix">
    <div>
      <h1 class="titol-joc">TELÓ <span>FINAL</span></h1>
      <p class="text-fase" id="text-fase"></p>
    </div>
    <div class="comptadors">
      <div class="comptador"><b id="c-jugadors">0</b><span>Jugadors</span></div>
      <div class="comptador" id="caixa-vots" hidden><b id="c-vots">0</b><span>Vots</span></div>
    </div>
  </div>
</div>
<div class="revelacio" id="revelacio" hidden></div>
<div class="error-pantalla" id="error" hidden></div>

<script src="vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/comu.js"></script>
<script src="js/pantalla.js"></script>
</body>
</html>
